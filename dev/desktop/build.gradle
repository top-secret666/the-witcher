java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

sourceSets.main.java.srcDirs = ['src/main/java']

project.ext.mainClassName = 'main.java.com.witcher.desktop.DesktopLauncher'
project.ext.assetsDir = new File('../src/main/resources/assets')

tasks.register('run', JavaExec) {
    dependsOn classes
    mainClass = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true
    maxHeapSize = '512m'
}

/** Пишет classpath в файл — для run-gdx-quick.bat без Gradle daemon. */
tasks.register('writeClasspath') {
    dependsOn classes
    doLast {
        def out = rootProject.file('.gdx-classpath.txt')
        out.text = sourceSets.main.runtimeClasspath.asPath
        println 'Classpath zapisан: ' + out.absolutePath
    }
}

dependencies {
    implementation project(':core')
    api "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    api "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}
